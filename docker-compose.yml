# Multi-container stack: FastAPI triage API + Redis request counter
services:
  # Internal Redis store for the prediction counter (reachable only on the Compose network)
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # FastAPI inference service; waits for Redis to be healthy before starting
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODEL_VERSION: ${MODEL_VERSION:-1.0.0}
        GIT_SHA: ${GIT_SHA:-unknown}
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME in .env}/breast-cancer-triage-api:${IMAGE_TAG:-1.0.0}
    ports:
      - "${HOST_PORT:-8080}:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DECISION_THRESHOLD: ${DECISION_THRESHOLD:-0.5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

# Named volume for persistent Redis append-only file (AOF) data
volumes:
  redis-data:

